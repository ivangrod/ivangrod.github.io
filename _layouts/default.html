<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | Needlehack</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/assets/css/main.css">
  {%- seo -%}
</head>
<body class="font-sans text-gray-900">

  <!-- HEADER -->
  <header class="header-shadow fixed w-full top-0 z-50 bg-white">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="font-bold text-2xl text-blue-600">Needlehack</div>
      <nav class="hidden md:flex gap-6 items-center">
        <a href="#aboutus" class="btn-primary">About us</a>
        <a href="#contact" class="nav-link">Contact</a>
      </nav>
      <button id="mobile-toggle" class="md:hidden focus:outline-none">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
    </div>

    <!-- Mobile Menu -->
    <div id="mobile-menu" class="mobile-menu hidden px-6 pb-4">
      <a href="#aboutus" class="nav-link block">About us</a>
      <a href="#contact" class="btn-primary block text-center">Contact</a>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main>
    {{ content }}
  </main>

  <!-- FOOTER con hover effects -->
  <footer class="bg-gray-900 text-gray-400 py-12">
    <div class="text-center text-gray-500 mt-12">&copy; 2025 Needlehack. All rights reserved.</div>
  </footer>

  <script>
    const toggleBtn = document.getElementById('mobile-toggle');
    const mobileMenu = document.getElementById('mobile-menu');
    toggleBtn.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
    });
  </script>
</body>
</html>
